[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quadraui-files"
version = "0.1.0"
description = "A cross-backend file manager built on quadraui's Python bindings — the same code runs in the terminal (TUI) and as a native desktop window."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Donaghy" }]
keywords = ["quadraui", "tui", "gui", "file-manager", "cross-platform"]

# quadraui-py is on PyPI as `quadraui`; 0.10.1 is the first release with
# everything this app uses (deferred actions, native chrome, and the
# `quadraui.app.hot_reload` building blocks `--reload` runs on). Prebuilt
# wheels: macOS/Windows (native window + TUI) and Linux (TUI-only).
dependencies = [
    "quadraui==0.10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quadraui-files = "quadraui_files.cli:main"

[project.urls]
Homepage = "https://github.com/JDonaghy/quadraui-files"
quadraui = "https://github.com/JDonaghy/quadraui"

[tool.hatch.build.targets.wheel]
packages = ["src/quadraui_files"]

[tool.pytest.ini_options]
# `pythonpath` keeps a bare `pytest -q` from the repo root working off the
# source tree, so the suite only needs `quadraui` importable in the active
# virtualenv -- not a successful install of this project on top of it.
testpaths = ["tests"]
pythonpath = ["src"]
