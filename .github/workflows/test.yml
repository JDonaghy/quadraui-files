name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: black-box (tui, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # quadraui-py is built from source (the pinned quadraui@develop git dep in
      # pyproject), so the install needs a Rust toolchain + maturin.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install (builds quadraui-py from the pinned quadraui commit)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Black-box tests (TUI/headless — the acceptance bar)
        run: pytest -q
