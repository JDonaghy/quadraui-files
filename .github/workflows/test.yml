name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: black-box (tui, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # quadraui ships prebuilt PyPI wheels since 0.10.1, so the install is a
      # plain download -- no Rust toolchain needed anymore.
      - name: Install (pulls the pinned quadraui wheel from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # scripts/test.sh reuses this already-installed environment rather than
      # bootstrapping its own, so running it here covers the same entry point
      # bare-checkout runners use.
      - name: Black-box tests (TUI/headless — the acceptance bar)
        run: sh scripts/test.sh
